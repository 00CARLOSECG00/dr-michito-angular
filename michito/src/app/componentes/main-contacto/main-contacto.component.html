<section class="contact-section">
  <div class="contact-container">
    <div class="contact-form" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="100">
      <h2 data-aos="fade-down" data-aos-duration="800">Contacto</h2>
      <form (ngSubmit)="sendForm()" #contactForm="ngForm">
        <div class="form-row">
          <div class="form-group" data-aos="fade-right" data-aos-duration="800" data-aos-delay="200">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" [(ngModel)]="form.nombre" placeholder="Tu nombre" required>
          </div>
          <div class="form-group" data-aos="fade-left" data-aos-duration="800" data-aos-delay="200">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" [(ngModel)]="form.apellido" placeholder="Tu apellido" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" data-aos="fade-right" data-aos-duration="800" data-aos-delay="300">
            <label for="email">Correo</label>
            <input type="email" id="email" name="email" [(ngModel)]="form.email" placeholder="tucorreo@ejemplo.com" required>
          </div>
        </div>

        <div class="form-group" data-aos="fade-up" data-aos-duration="800" data-aos-delay="400">
          <label for="message">Mensaje</label>
          <textarea id="message" name="message" [(ngModel)]="form.message" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>

        <button type="submit" data-aos="zoom-in" data-aos-duration="800" data-aos-delay="500">Enviar</button>
      </form>
    </div>
  </div>
</section>
